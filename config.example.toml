# $(herdr plugin config-dir herdr-oil)/config.toml — every key is optional.

# Editor command; default $VISUAL, then $EDITOR, then nvim. Args allowed.
# editor = "nvim"

# What Enter does with a file:
#   "view"        read-only viewer inside the oil window (default); e edits
#   "popup"       $EDITOR inside the popup, return to the explorer afterwards
#   "auto"        type `$EDITOR file` into the pane you came from when it sits
#                 at a shell prompt, else open a split to its right
#   "split" | "split-down" | "tab" | "system"
# open = "view"

# "trash" (default: ~/.Trash on macOS, XDG trash on Linux) or "permanent".
# delete = "trash"

# show_hidden = false
# details = "size"       # "size" (default), "full" = perms + size + age,
#                        # "meta" = owner + perms + xattrs (@) + broken links, "off"; gd cycles
# preview = true         # preview pane in the explorer (toggle: ctrl-p)
# icons = true           # needs a Nerd Font
# git_status = true      # M/A/?/! markers per entry (green staged, yellow unstaged,
#                        # peach both), branch ↑↓ badge, ]g [g, gG, gD
# diff_layout = "auto"   # diff view: "auto" (split from 160 columns), "unified", "split"
# confirm = true         # review dialog before applying (always on for deletes)
# stay_open = false      # keep the popup after handing a file to a split/tab
# respect_ignore = true  # finder honours .gitignore (toggle: alt-i)
# max_files = 200000     # finder walk cap

# Rename recipes for `:recipe NAME` (on the cursor line, a range or a
# selection). A recipe is one range command or a list run in order, as one
# undo step; built-ins: kebab snake slugify lower upper title clean screenshots.
# [recipes]
# photos = ["screenshots", "prefix {02#}-"]   # {#} counts: {02#} 01 02 …
# underscores = "s/ /_/g"

# Projects tab (␣p): defaults come from herdr-hop's config.toml when it is
# installed (and its recent.tsv is shared); set any key here to override.
# [projects]
# roots = ["~/Projects"]
# max_depth = 2
# recent_limit = 12
# default_root = "~/Projects"   # where ^n creates projects
# default_branch = "main"
